
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ברכה לאחותי</title>
  <style>
    body {
      font-family: "Arial", sans-serif;
      background: linear-gradient(135deg, #fff0f5, #ffe4e1);
      text-align: center;
      padding: 40px;
      color: #333;
    }

    h1 {
      font-size: 48px;
      color: #c2185b;
      animation: fadeIn 2s ease-in-out;
    }

    p {
      font-size: 22px;
      margin-top: 20px;
      line-height: 1.6;
      animation: slideUp 2s ease-in-out;
    }

    .heart {
      font-size: 40px;
      color: red;
      animation: heartbeat 1.5s infinite;
      margin: 30px 0;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .heart.clicked {
      transform: scale(1.5);
    }

    img {
      width: 100%;
      max-width: 500px;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      margin-top: 30px;
    }

    #yt-player {
      margin-top: 30px;
      display: none;
    }

    .message {
      margin-top: 15px;
      font-size: 16px;
      color: green;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }
  </style>
</head>
<body>
  <h1>¡Feliz cumpleaños, hermana! 🎉</h1>
  <p>
    נולדת ב־77, אבל את עדיין אותה ילדה מתוקה עם חיוך ממיס!<br>
    הזמן עובר, ואיתו רק מתעצמים האהבה, הזיכרונות והחיבור בינינו.<br>
    מאחל לך בריאות, שמחה, רגעים יפים – וים של אהבה.<br>
    תישארי בדיוק כמו שאת – מיוחדת, מצחיקה ואחת ויחידה.
  </p>

  <div class="heart" onclick="showPlayer(this)">❤️</div>
  <div class="message" id="message"></div>

  <img src="image.png" alt="תמונה מהעבר">

  <div id="yt-player">
    <iframe width="360" height="215"
      src="https://www.youtube.com/embed/MP1G8wnLpSM?autoplay=1"
      frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  </div>

  <script>
    function showPlayer(element) {
      document.getElementById("yt-player").style.display = "block";
      element.classList.add("clicked");
      document.getElementById("message").innerText = "🎶 המוזיקה התחילה! 🎉";
    }
  </script>
</body>
</html>
